<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Start Page</title>
  <link rel="stylesheet" href="/studio/studio.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><b>Studio</b><span id="server-line"></span></div>
    <div class="who" id="who" style="display:none">
      <span class="avatar" id="who-initial"></span><span class="name" id="who-name"></span><span class="tag blue" id="who-admin" style="display:none">Admin</span>
      <button class="quiet small" id="logout" type="button">Log out</button>
    </div>
  </header>
  <div class="notice" id="not-studio" style="display:none">Open this page from Roblox Studio to edit games.</div>

  <form class="login" id="login-form" autocomplete="off" style="display:none">
    <h1>Log in</h1>
    <p class="hint">New name? That makes your account. Use your Roblox name to get your avatar in games.</p>
    <label for="login-name">Username</label>
    <input type="text" id="login-name" maxlength="20" spellcheck="false">
    <label for="login-password">Password</label>
    <input type="password" id="login-password" maxlength="200">
    <button type="submit" class="btn" id="login-go">Log in</button>
    <span class="status" id="login-status"></span>
  </form>

  <div class="page" id="games-panel" style="display:none">
    <div class="toolbar clear" id="toolbar">
      <div class="tabs" id="tabs">
        <a data-tab="mine">My games<span class="n" id="n-mine"></span></a><a data-tab="shared">Shared with me<span class="n" id="n-shared"></span></a><a data-tab="all" id="tab-all" style="display:none">All games<span class="n" id="n-all"></span></a>
      </div>
      <div class="tools">
        <span class="search">
          <svg width="14" height="14" viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="5" fill="none" stroke="#8a919a" stroke-width="2"/><line x1="10.5" y1="10.5" x2="15" y2="15" stroke="#8a919a" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="search" placeholder="Search" spellcheck="false">
        </span>
        <select id="sort">
          <option value="recent">Recent</option>
          <option value="name">Name</option>
          <option value="players">Players</option>
        </select>
        <button type="button" class="btn" id="new-place"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>New place</button>
      </div>
    </div>
    <div class="grid clear" id="grid"></div>
  </div>

  <script src="/studio/studio.js"></script>
  <script>
  (function () {
    var $ = Studio.$, make = Studio.make;
    var me = null;
    var games = [];
    var tab = 'mine';
    var sort = 'recent';
    var editing = null;      // the game in the editors dialog
    var toastTimer = null;

    function remember(name, value) { try { window.localStorage.setItem('studio-' + name, value); } catch (e) { /* storage off */ } }
    function recall(name) { try { return window.localStorage.getItem('studio-' + name) || ''; } catch (e) { return ''; } }

    // Players reach the server through their launcher as "localhost": say nothing then.
    var host = location.host.replace(/\.$/, '').replace(/\.(:\d+)$/, '$1');
    if (!/^localhost(:\d+)?$/i.test(host)) Studio.text($('server-line'), host);

    function toast(message, bad, sticky) {
      var el = $('toast');
      if (!el) { el = make('div', 'toast'); el.id = 'toast'; document.body.appendChild(el); }
      el.className = 'toast' + (bad ? ' bad' : '');
      Studio.text(el, message);
      Studio.show(el, true);
      clearTimeout(toastTimer);
      if (!sticky) toastTimer = setTimeout(function () { Studio.show(el, false); }, bad ? 7000 : 3500);
    }

    // --- opening a game ------------------------------------------------------------------

    function open(placeId, name) {
      if (!Studio.inStudio()) { toast('Open this page from Roblox Studio to edit games.', true); return; }
      toast(placeId ? 'Opening ' + name + '…' : 'Opening a new place…', false, true);
      Studio.api('POST', '/studio/api/open', { placeId: placeId }, function (error, data) {
        if (error) { toast(error, true); return; }
        window.external.StartGame(data.ticket || '', data.url || '', data.script);
        toast(placeId ? name + ' opens in a new window.' : 'The new place opens in a new window.');
      });
    }

    // --- cards -----------------------------------------------------------------------------

    var SHADES = ['#3d6f9e', '#4f7f5c', '#8a5a8f', '#9a6a3a', '#3f7f86', '#7a4f4f', '#5d5f9a', '#6b7a3d'];

    function thumb(game) {
      var el = make('a', 'thumb');
      el.title = 'Edit ' + game.name;
      if (game.thumbnail) {
        el.style.backgroundImage = 'url(/api/thumbnails/' + game.placeId + '?v=' + Number(game.thumbnail) + ')';
      } else {
        el.style.backgroundColor = SHADES[game.placeId % SHADES.length];
        el.appendChild(make('div', 'letter', (game.name.replace(/[^A-Za-z0-9]/g, '').charAt(0) || '?').toUpperCase()));
      }
      var pill = make('span', 'pill');
      var dot = make('span', 'dot');
      pill.appendChild(dot);
      if (!game.online) pill.appendChild(document.createTextNode('Offline'));
      else if (game.running && game.players > 0) { pill.className = 'pill live'; pill.appendChild(document.createTextNode(game.players + ' playing')); }
      else { pill.className = 'pill idle'; pill.appendChild(document.createTextNode('Online')); }
      el.appendChild(pill);
      if (game.teamCreate) el.appendChild(make('span', 'tag tc', 'Team Create'));
      el.appendChild(make('span', 'open', 'Edit'));
      el.onclick = function () { open(game.placeId, game.name); };
      return el;
    }

    function subLine(game) {
      // updatedAt also moves when the name or editors change: "Updated", not "Edited".
      var edited = Studio.timeAgo(game.updatedAt);
      edited = edited ? 'Updated ' + edited : '';
      if (game.role === 'owner') return edited;
      var by = game.owner ? 'By ' + game.owner : 'No owner';
      return edited ? by + ' · ' + edited : by;
    }

    function card(game) {
      var el = make('div', 'card');
      el.appendChild(thumb(game));
      var body = make('div', 'body');
      var title = make('div', 'title', game.name);
      title.title = game.name;
      body.appendChild(title);
      body.appendChild(make('div', 'sub', subLine(game)));
      var actions = make('div', 'actions');
      var edit = make('button', 'btn small', 'Edit');
      edit.type = 'button';
      edit.onclick = function () { open(game.placeId, game.name); };
      actions.appendChild(edit);
      if (game.isOwner || (me && me.admin && game.owner)) {
        var people = make('button', 'btn small quiet', 'Editors');
        people.type = 'button';
        people.onclick = function () { openEditors(game); };
        actions.appendChild(people);
      }
      actions.appendChild(make('span', 'id', '#' + game.placeId));
      body.appendChild(actions);
      el.appendChild(body);
      return el;
    }

    // --- list --------------------------------------------------------------------------------

    function inTab(game, which) {
      if (which === 'mine') return game.role === 'owner';
      if (which === 'shared') return game.role === 'editor';
      return true;
    }

    function count(which) {
      var n = 0;
      for (var i = 0; i < games.length; i++) if (inTab(games[i], which)) n++;
      return n;
    }

    function sorted(list) {
      return list.sort(function (a, b) {
        if (sort === 'name') return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : a.name.toLowerCase() > b.name.toLowerCase() ? 1 : 0;
        if (sort === 'players' && b.players !== a.players) return b.players - a.players;
        return (Date.parse(b.updatedAt) || 0) - (Date.parse(a.updatedAt) || 0);
      });
    }

    function emptyState(query) {
      var el = make('div', 'empty');
      if (query) {
        el.appendChild(make('b', '', 'No games match “' + query + '”'));
        return el;
      }
      if (tab === 'mine') {
        el.appendChild(make('b', '', 'No games yet'));
        el.appendChild(document.createTextNode('Start with a baseplate, then publish it to this server.'));
        el.appendChild(make('br'));
        var start = make('button', 'btn', 'New place');
        start.type = 'button';
        start.onclick = function () { open(0); };
        el.appendChild(start);
      } else if (tab === 'shared') {
        el.appendChild(make('b', '', 'Nothing shared yet'));
        el.appendChild(document.createTextNode('Games appear here when an owner adds you as an editor.'));
      } else {
        el.appendChild(make('b', '', 'No games on this server'));
      }
      return el;
    }

    function render() {
      var tabs = $('tabs').getElementsByTagName('a');
      for (var t = 0; t < tabs.length; t++) tabs[t].className = tabs[t].getAttribute('data-tab') === tab ? 'on' : '';
      Studio.text($('n-mine'), String(count('mine')));
      Studio.text($('n-shared'), String(count('shared')));
      Studio.text($('n-all'), String(count('all')));

      var query = $('search').value.replace(/^\s+|\s+$/g, '');
      var needle = query.toLowerCase();
      var shown = [];
      for (var i = 0; i < games.length; i++) {
        var game = games[i];
        if (!inTab(game, tab)) continue;
        if (needle && (game.name + ' ' + game.placeId + ' ' + (game.owner || '')).toLowerCase().indexOf(needle) < 0) continue;
        shown.push(game);
      }
      var grid = $('grid');
      grid.innerHTML = '';
      sorted(shown);
      for (var k = 0; k < shown.length; k++) grid.appendChild(card(shown[k]));
      if (!shown.length) grid.appendChild(emptyState(query));
      fit();
    }

    // Centers the cards: as many 260 px columns as fit.
    function fit() {
      var room = document.documentElement.clientWidth - 48 + 16;
      var columns = Math.max(1, Math.floor(room / 260));
      $('grid').style.width = (columns * 260) + 'px';
      $('grid').style.margin = '0 auto';
      $('toolbar').style.width = Math.max(columns * 260 - 16, 0) + 'px';
      $('toolbar').style.margin = '0 auto';
    }

    function loadGames() {
      var scope = me && me.admin ? '?scope=all' : '';
      Studio.api('GET', '/studio/api/games' + scope, null, function (error, data) {
        if (error) { toast(error, true); return; }
        games = data.games || [];
        render();
      });
    }

    function pickTab(which) {
      if (which === 'all' && !(me && me.admin)) which = 'mine';
      tab = which;
      remember('tab', tab);
      render();
    }

    // --- editors dialog -------------------------------------------------------------------

    function closeEditors() {
      editing = null;
      var box = $('editors');
      if (box) box.parentNode.removeChild(box);
    }

    function saveEditors(game, names, done) {
      var state = $('editors-status');
      Studio.status(state, 'Saving…');
      Studio.api('POST', '/studio/api/editors', { placeId: game.placeId, editors: names }, function (error, data) {
        if (error) { Studio.status(state, error, 'bad'); return; }
        game.editors = data.editors;
        Studio.status(state, 'Saved', 'good');
        fillPeople(game);
        if (done) done();
      });
    }

    function fillPeople(game) {
      var list = $('editors-list');
      list.innerHTML = '';
      if (!game.editors.length) list.appendChild(make('span', 'none', 'No editors yet.'));
      for (var i = 0; i < game.editors.length; i++) {
        (function (name) {
          var person = make('span', 'person', name);
          var remove = make('a', '', '×');
          remove.title = 'Remove ' + name;
          remove.onclick = function () {
            var names = [];
            for (var j = 0; j < game.editors.length; j++) if (game.editors[j] !== name) names.push(game.editors[j]);
            saveEditors(game, names);
          };
          person.appendChild(remove);
          list.appendChild(person);
        }(game.editors[i]));
      }
    }

    function openEditors(game) {
      closeEditors();
      editing = game;
      var box = make('div');
      box.id = 'editors';
      var scrim = make('div', 'scrim');
      scrim.onclick = closeEditors;
      box.appendChild(scrim);
      var dialog = make('div', 'dialog');
      dialog.appendChild(make('h3', '', 'Editors'));
      dialog.appendChild(make('div', 'sub', game.name));
      var list = make('div', 'people');
      list.id = 'editors-list';
      dialog.appendChild(list);
      var form = make('form', 'add');
      var input = make('input');
      input.type = 'text';
      input.maxLength = 20;
      input.placeholder = 'Username';
      input.setAttribute('spellcheck', 'false');
      var add = make('button', 'btn ghost', 'Add');
      add.type = 'submit';
      form.appendChild(input);
      form.appendChild(add);
      form.onsubmit = function (event) {
        event.preventDefault();
        var name = input.value.replace(/^\s+|\s+$/g, '');
        if (!name) return;
        saveEditors(game, game.editors.concat([name]), function () { input.value = ''; });
      };
      dialog.appendChild(form);
      var state = make('span', 'status');
      state.id = 'editors-status';
      dialog.appendChild(state);
      var foot = make('div', 'foot');
      var done = make('button', 'btn', 'Done');
      done.type = 'button';
      done.onclick = closeEditors;
      foot.appendChild(done);
      dialog.appendChild(foot);
      box.appendChild(dialog);
      document.body.appendChild(box);
      fillPeople(game);
      input.focus();
    }

    // --- log in / out ----------------------------------------------------------------------

    function loggedIn(account) {
      me = account;
      Studio.text($('who-initial'), account.name.charAt(0).toUpperCase());
      Studio.text($('who-name'), account.name);
      Studio.show($('who-admin'), Boolean(account.admin));
      Studio.show($('tab-all'), Boolean(account.admin));
      Studio.show($('who'), true);
      Studio.show($('login-form'), false);
      Studio.show($('games-panel'), true);
      tab = recall('tab') || 'mine';
      if (tab === 'all' && !account.admin) tab = 'mine';
      loadGames();
    }

    function loggedOut() {
      me = null;
      games = [];
      closeEditors();
      Studio.show($('who'), false);
      Studio.show($('games-panel'), false);
      Studio.show($('login-form'), true);
      $('login-name').focus();
    }

    var tabLinks = $('tabs').getElementsByTagName('a');
    for (var i = 0; i < tabLinks.length; i++) {
      tabLinks[i].onclick = function () { pickTab(this.getAttribute('data-tab')); };
    }
    $('search').oninput = render;
    sort = recall('sort') || 'recent';
    $('sort').value = sort;
    $('sort').onchange = function () { sort = $('sort').value; remember('sort', sort); render(); };
    $('new-place').onclick = function () { open(0); };
    $('logout').onclick = function () { Studio.logout(loggedOut); };
    window.onresize = function () { if (me) fit(); };
    document.onkeydown = function (event) {
      if ((event.keyCode || event.which) === 27 && editing) closeEditors();
    };

    Studio.loginForm(loggedIn);
    Studio.show($('not-studio'), !Studio.inStudio());
    Studio.api('GET', '/studio/api/me', null, function (error, data) {
      if (!error && data.account) loggedIn(data.account);
      else loggedOut();
    });
    // Players come and go: keep the counts fresh (not while a dialog is open).
    setInterval(function () { if (me && !editing) loadGames(); }, 30000);
  }());
  </script>
</body>
</html>
