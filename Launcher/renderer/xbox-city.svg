<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- The "Xbox One" theme's backdrop: a dim navy city at night, drawn for
       rbx2017 (not taken from any Roblox art). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2e3e"/>
      <stop offset=".55" stop-color="#0f212f"/>
      <stop offset="1" stop-color="#0c1d2a"/>
    </linearGradient>
    <radialGradient id="hazeL" cx=".18" cy=".2" r=".5">
      <stop offset="0" stop-color="#2a4458" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2a4458" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hazeR" cx=".88" cy=".35" r=".45">
      <stop offset="0" stop-color="#26405a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#26405a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132a3b"/>
      <stop offset="1" stop-color="#0a1925"/>
    </linearGradient>
    <linearGradient id="towerFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3344"/>
      <stop offset="1" stop-color="#14283a"/>
    </linearGradient>
    <linearGradient id="towerNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132739"/>
      <stop offset="1" stop-color="#0b1a26"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#hazeL)"/>
  <rect width="1920" height="1080" fill="url(#hazeR)"/>

  <!-- far skyline -->
  <g fill="url(#towerFar)" opacity=".8">
    <rect x="260" y="380" width="70" height="560"/>
    <rect x="345" y="300" width="54" height="640"/>
    <rect x="520" y="420" width="90" height="520"/>
    <rect x="640" y="250" width="60" height="690"/>
    <rect x="980" y="340" width="80" height="600"/>
    <rect x="1080" y="410" width="54" height="530"/>
    <rect x="1240" y="280" width="70" height="660"/>
    <rect x="1420" y="360" width="100" height="580"/>
    <rect x="1560" y="230" width="58" height="710"/>
    <rect x="1700" y="400" width="84" height="540"/>
  </g>

  <!-- near towers with rings and pipes -->
  <g fill="url(#towerNear)">
    <rect x="430" y="180" width="96" height="760"/>
    <rect x="760" y="120" width="120" height="820"/>
    <rect x="900" y="260" width="64" height="680"/>
    <rect x="1150" y="160" width="104" height="780"/>
    <rect x="1330" y="210" width="76" height="730"/>
    <rect x="1630" y="300" width="70" height="640"/>
    <rect x="526" y="560" width="234" height="18"/>
    <rect x="1254" y="470" width="76" height="14"/>
    <rect x="880" y="640" width="20" height="300"/>
  </g>
  <g fill="none" stroke="#21394d" stroke-width="10" opacity=".9">
    <ellipse cx="820" cy="300" rx="120" ry="26"/>
    <ellipse cx="820" cy="470" rx="96" ry="20"/>
    <ellipse cx="1202" cy="360" rx="104" ry="22"/>
    <ellipse cx="478" cy="420" rx="82" ry="17"/>
    <ellipse cx="1368" cy="560" rx="70" ry="15"/>
  </g>
  <g fill="#1f374b" opacity=".7">
    <rect x="790" y="118" width="60" height="6"/>
    <rect x="1180" y="156" width="44" height="6"/>
    <rect x="452" y="176" width="52" height="6"/>
  </g>
  <!-- a few lit windows -->
  <g fill="#2f4d66" opacity=".55">
    <rect x="782" y="200" width="8" height="12"/><rect x="806" y="232" width="8" height="12"/><rect x="842" y="268" width="8" height="12"/>
    <rect x="1170" y="230" width="8" height="12"/><rect x="1212" y="262" width="8" height="12"/><rect x="1190" y="520" width="8" height="12"/>
    <rect x="452" y="260" width="8" height="12"/><rect x="490" y="330" width="8" height="12"/><rect x="1350" y="300" width="8" height="12"/>
    <rect x="1648" y="380" width="8" height="12"/><rect x="926" y="330" width="8" height="12"/>
  </g>

  <!-- plaza and water -->
  <rect x="0" y="930" width="1920" height="150" fill="url(#water)"/>
  <rect x="0" y="926" width="1920" height="8" fill="#1a3245" opacity=".8"/>
  <g fill="#1d374b" opacity=".45">
    <rect x="300" y="960" width="420" height="3"/>
    <rect x="880" y="990" width="520" height="3"/>
    <rect x="1500" y="965" width="300" height="3"/>
    <rect x="120" y="1020" width="380" height="3"/>
  </g>
  <!-- small figures on the plaza -->
  <g fill="#0a1824">
    <rect x="980" y="902" width="10" height="24"/><rect x="981" y="890" width="8" height="10"/>
    <rect x="1030" y="906" width="9" height="20"/><rect x="1031" y="896" width="7" height="9"/>
    <rect x="1460" y="900" width="10" height="26"/><rect x="1461" y="888" width="8" height="10"/>
  </g>

  <!-- a dark tree on the left -->
  <g fill="#08141d">
    <rect x="128" y="640" width="26" height="300"/>
    <circle cx="140" cy="560" r="120"/>
    <circle cx="60" cy="640" r="92"/>
    <circle cx="230" cy="640" r="96"/>
    <circle cx="150" cy="450" r="86"/>
  </g>
  <!-- the dark column on the right edge -->
  <rect x="1880" y="0" width="40" height="1080" fill="#07131c" opacity=".7"/>
</svg>
