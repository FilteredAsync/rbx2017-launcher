<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home - rbx2017</title>
<meta name="description" content="Your rbx2017 home.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00a2ff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&amp;display=swap">
<link rel="stylesheet" href="/css/site.css?v=be6653ff39">
<script src="/js/site.js?v=258cbdf7c8" defer></script>
</head>
<body data-page="account-home">
<header class="rbx-header">
  <div class="header-row">
    <a class="brand" href="/" aria-label="rbx2017 home"><span class="brand-name">rbx</span><span class="brand-year">2017</span></a>
    <nav class="header-nav" aria-label="Main">
      <a href="/games">Games</a>
      <a href="/download">Download</a>
      <a href="/help">Help</a>
    </nav>
    <form class="header-search" action="/games" method="get" role="search">
      <input type="search" name="q" placeholder="Search games" aria-label="Search games" autocomplete="off" maxlength="60">
      <button type="submit" aria-label="Search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.42 1.4-5.39-5.38A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg></button>
    </form>
    <div class="header-right"><span class="online-count hidden" id="online-count" role="status"></span><div class="header-account" id="header-account"></div></div>
  </div>
</header>

<main class="container-main">
  <section class="hello" id="hello">
    <div class="hello-picture" id="hello-picture"></div>
    <div class="hello-text">
      <h1 id="hello-name" class="loading">Hello!</h1>
      <p class="hello-sub" id="hello-sub"></p>
    </div>
  </section>
  <div class="home-columns">
    <div class="home-main">
      <section class="section" id="friends-section">
        <div class="container-header"><h2 id="friends-title">Friends</h2></div>
        <div class="friends-row" id="friends-row"></div>
      </section>
      <div id="account-rows"></div>
    </div>
    <aside class="home-side">
      <section class="robux-card" id="robux-card" aria-labelledby="robux-title">
        <h2 id="robux-title">Your R$</h2>
        <div class="robux-balance"><span class="rbx-badge big" aria-hidden="true">R$</span><span id="robux-balance">-</span></div>
        <h3>Earn more</h3>
        <ul class="robux-list" id="robux-earn"></ul>
        <h3 id="robux-history-title">Recent</h3>
        <ul class="robux-list" id="robux-history"></ul>
      </section>
    </aside>
  </div>
</main>

<footer class="site-footer">
  <nav class="footer-links" aria-label="Footer">
    <a href="/games">Games</a>
    <a href="/download">Download</a>
    <a href="/help">Help</a>
    <a href="https://github.com/FilteredAsync/rbx2017-launcher">GitHub</a>
  </nav>
  <p class="footer-note">rbx2017 is a fan project. It is not affiliated with or endorsed by Roblox Corporation.</p>
</footer>
</body>
</html>
